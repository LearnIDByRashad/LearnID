<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔒 UJIAN ONLINE SMK | LearnID / TeachID</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0f1a 0%, #0a0a0f 100%);
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* LOADING SCREEN */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .loading-screen .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #2a3040;
      border-top: 4px solid #ffaa44;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-screen p {
      font-size: 1rem;
      color: #ffaa44;
      letter-spacing: 2px;
    }
    
    .loading-screen .credit-load {
      margin-top: 30px;
      font-size: 0.7rem;
      color: #555;
    }
    
    /* Login Page */
    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .login-card {
      background: #11151f;
      border-radius: 32px;
      padding: 40px 30px;
      text-align: center;
      border: 1px solid #2a3040;
      max-width: 400px;
      width: 100%;
    }
    
    .login-card h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff, #a0a0a0);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    
    .login-card .sub {
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 30px;
    }
    
    .role-buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .role-btn {
      flex: 1;
      background: #1a1f2e;
      border: 2px solid #2a3040;
      border-radius: 60px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .role-btn:hover {
      border-color: #ffaa44;
      transform: translateY(-2px);
    }
    
    .role-btn.selected {
      border-color: #ffaa44;
      background: #2a3045;
    }
    
    .role-btn i {
      font-size: 2rem;
      display: block;
      margin-bottom: 8px;
    }
    
    .role-btn.learnid i { color: #44aaff; }
    .role-btn.teachid i { color: #ffaa44; }
    
    .login-input {
      margin-top: 20px;
      display: none;
    }
    
    .login-input.show {
      display: block;
    }
    
    .login-input input {
      width: 100%;
      padding: 14px;
      border-radius: 60px;
      border: 1px solid #2a3040;
      background: #1a1f2e;
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
    }
    
    .login-input input:focus {
      border-color: #ffaa44;
    }
    
    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 60px;
      background: #ffaa44;
      color: #1a1a1a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    
    .credit-footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.7rem;
      color: #555;
    }
    
    /* Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .lockdown-bar {
      background: #dc2626;
      color: white;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .timer-box {
      background: #1a1f2e;
      border: 2px solid #ff4444;
      border-radius: 60px;
      padding: 12px 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .timer {
      font-size: 2.5rem;
      font-weight: bold;
      font-family: monospace;
      color: #ff4444;
    }
    
    .soal-card {
      background: #11151f;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2a3040;
    }
    
    .soal-text {
      font-size: 1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .option {
      background: #1a1f2e;
      border: 1px solid #2a3040;
      border-radius: 50px;
      padding: 12px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .option.selected {
      background: #2a3045;
      border-color: #ffaa44;
    }
    
    .option-letter {
      font-weight: bold;
      color: #ffaa44;
      width: 28px;
    }
    
    .nav-buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    
    button {
      background: #2a3040;
      border: none;
      padding: 12px 20px;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
    }
    
    button.primary {
      background: #ffaa44;
      color: #1a1a1a;
    }
    
    button.danger {
      background: #dc2626;
    }
    
    .progress {
      text-align: center;
      margin-top: 15px;
      font-size: 0.75rem;
      color: #888;
    }
    
    /* Dashboard */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .btn-tambah {
      background: #ffaa44;
      color: #1a1a1a;
      padding: 10px 20px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
    }
    
    .btn-logout {
      background: #dc2626;
      color: white;
      padding: 10px 20px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
    }
    
    .soal-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .soal-item {
      background: #1a1f2e;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #2a3040;
    }
    
    .soal-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .kunci-badge {
      background: #ffaa4422;
      border: 1px solid #ffaa44;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      display: inline-block;
      margin-top: 8px;
    }
    
    .result-card {
      background: #11151f;
      border-radius: 24px;
      padding: 30px;
      text-align: center;
    }
    
    .nilai-besar {
      font-size: 3rem;
      font-weight: bold;
      margin: 20px 0;
    }
    
    .hidden {
      display: none;
    }
    
    @media (max-width: 600px) {
      .role-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <p>⚡ SEDANG LOADING ⚡</p>
  <p style="font-size: 0.7rem; margin-top: 5px;">harap tunggu sebentar...</p>
  <div class="credit-load">© 2024 | Rashad Dev</div>
</div>

<div id="app" style="display: none;">
  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <div class="login-page">
      <div class="login-card">
        <h1>📚 UJIAN ONLINE SMK</h1>
        <div class="sub">Pilih Role Login</div>
        
        <div class="role-buttons">
          <div class="role-btn learnid" id="learnBtn">
            <i>🎓</i>
            <div>LearnID</div>
            <div style="font-size: 10px; color: #888;">Siswa</div>
          </div>
          <div class="role-btn teachid" id="teachBtn">
            <i>👨‍🏫</i>
            <div>TeachID</div>
            <div style="font-size: 10px; color: #888;">Guru</div>
          </div>
        </div>
        
        <div id="loginInput" style="display: none; margin-top: 20px;">
          <input type="text" id="namaInput" placeholder="Masukkan Nama Lengkap">
          <input type="text" id="kelasInput" placeholder="Kelas">
          <button id="submitLoginBtn" class="login-btn">Login</button>
        </div>
        
        <div class="credit-footer">
          <i class="fas fa-code"></i> Dibuat oleh <strong>Rashad</strong> | SMK Developer
        </div>
      </div>
    </div>
  </div>
  
  <!-- MAIN APP -->
  <div id="mainApp" style="display: none;"></div>
</div>

<script>
  // ========== DATA SOAL & KUNCI JAWABAN ==========
  let soalData = [
    { text: "Apa kepanjangan dari SMK?", options: ["Sekolah Menengah Kejuruan", "Sekolah Menengah Karir", "Sekolah Menengah Kreatif", "Sekolah Menengah Kompeten"], kunci: 0 },
    { text: "Berapa nilai minimal KKM umumnya?", options: ["60", "65", "70", "75"], kunci: 0 },
    { text: "Apa itu Ujian Sekolah?", options: ["Ujian yang diselenggarakan oleh sekolah", "Ujian nasional", "Ujian masuk PTN", "Ujian praktek saja"], kunci: 0 },
    { text: "Siapa yang bertanggung jawab atas ujian sekolah?", options: ["Kepala Sekolah", "Guru", "Dinas Pendidikan", "Semua benar"], kunci: 3 },
    { text: "Apa tujuan utama ujian sekolah?", options: ["Mengukur kompetensi siswa", "Membuat siswa stres", "Mengisi waktu", "Menaikkan gaji guru"], kunci: 0 }
  ];
  
  let selectedRole = null;
  
  // ========== HILANGKAN LOADING ==========
  setTimeout(() => {
    const loadingScreen = document.getElementById('loadingScreen');
    loadingScreen.style.opacity = '0';
    setTimeout(() => {
      loadingScreen.style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }, 500);
  }, 2000);
  
  // ========== DOM Elements ==========
  const learnBtn = document.getElementById('learnBtn');
  const teachBtn = document.getElementById('teachBtn');
  const loginInputDiv = document.getElementById('loginInput');
  const namaInput = document.getElementById('namaInput');
  const kelasInput = document.getElementById('kelasInput');
  const submitLoginBtn = document.getElementById('submitLoginBtn');
  
  // ========== Fungsi Pilih Role ==========
  learnBtn.onclick = function() {
    selectedRole = 'learn';
    learnBtn.style.borderColor = '#ffaa44';
    learnBtn.style.background = '#2a3045';
    teachBtn.style.borderColor = '#2a3040';
    teachBtn.style.background = '#1a1f2e';
    kelasInput.style.display = 'block';
    kelasInput.placeholder = "Kelas (contoh: XII RPL 1)";
    loginInputDiv.style.display = 'block';
  };
  
  teachBtn.onclick = function() {
    selectedRole = 'teach';
    teachBtn.style.borderColor = '#ffaa44';
    teachBtn.style.background = '#2a3045';
    learnBtn.style.borderColor = '#2a3040';
    learnBtn.style.background = '#1a1f2e';
    kelasInput.style.display = 'none';
    loginInputDiv.style.display = 'block';
  };
  
  // ========== Fungsi Login ==========
  submitLoginBtn.onclick = function() {
    const nama = namaInput.value.trim();
    const kelas = kelasInput.value.trim();
    
    if (!nama) {
      alert("Masukkan nama lengkap!");
      return;
    }
    
    if (!selectedRole) {
      alert("Pilih role terlebih dahulu!");
      return;
    }
    
    if (selectedRole === 'learn' && !kelas) {
      alert("Masukkan kelas!");
      return;
    }
    
    if (selectedRole === 'learn') {
      startExam(nama, kelas);
    } else {
      startTeacherDashboard(nama);
    }
  };
  
  // ========== UJIAN SISWA ==========
  let jawaban = [];
  let currentSoal = 0;
  let waktu = 90 * 60;
  let timerInterval = null;
  let ujianSelesai = false;
  
  function startExam(nama, kelas) {
    jawaban = new Array(soalData.length).fill(null);
    currentSoal = 0;
    waktu = 90 * 60;
    ujianSelesai = false;
    if (timerInterval) clearInterval(timerInterval);
    
    document.getElementById('loginPage').style.display = 'none';
    const mainApp = document.getElementById('mainApp');
    
    mainApp.innerHTML = `
      <div class="lockdown-bar">🔒 LOCKDOWN MODE 🔒 | DILARANG KELUAR</div>
      <div class="container">
        <div style="background: #1a1f2e; border-radius: 16px; padding: 12px; margin-bottom: 20px;">
          <p>👤 Nama: <strong>${nama}</strong></p>
          <p>📚 Kelas: <strong>${kelas}</strong></p>
        </div>
        <div class="timer-box">
          <div class="timer" id="timerDisplay">90:00</div>
          <div>Sisa Waktu</div>
        </div>
        <div id="soalContainer"></div>
        <div class="nav-buttons">
          <button id="prevSoalBtn">◀ Sebelumnya</button>
          <button id="nextSoalBtn" class="primary">Selanjutnya ▶</button>
        </div>
        <div class="progress" id="progressText"></div>
        <button id="submitUjianBtn" class="danger" style="margin-top: 20px;">📤 SUBMIT UJIAN</button>
        <div class="credit-footer" style="margin-top: 20px;">© Dibuat oleh Rashad | SMK Dev</div>
      </div>
    `;
    
    mainApp.style.display = 'block';
    
    renderSoal();
    startTimer();
    
    document.getElementById('prevSoalBtn').onclick = () => { if (currentSoal > 0) { currentSoal--; renderSoal(); } };
    document.getElementById('nextSoalBtn').onclick = () => { if (currentSoal < soalData.length - 1) { currentSoal++; renderSoal(); } };
    document.getElementById('submitUjianBtn').onclick = () => submitExam(nama, kelas);
  }
  
  function renderSoal() {
    const container = document.getElementById('soalContainer');
    const soal = soalData[currentSoal];
    const jawab = jawaban[currentSoal];
    
    container.innerHTML = `
      <div class="soal-card">
        <div style="background: #ffaa44; color: #1a1a1a; display: inline-block; padding: 4px 12px; border-radius: 30px; font-size: 12px; margin-bottom: 15px;">
          Soal ${currentSoal + 1}
        </div>
        <div class="soal-text">${soal.text}</div>
        <div class="options">
          ${soal.options.map((opt, idx) => `
            <div class="option ${jawab === idx ? 'selected' : ''}" data-opt="${idx}">
              <span class="option-letter">${String.fromCharCode(65 + idx)}.</span>
              <span>${opt}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    
    document.querySelectorAll('.option').forEach(opt => {
      opt.onclick = () => {
        jawaban[currentSoal] = parseInt(opt.dataset.opt);
        renderSoal();
        updateProgress();
      };
    });
    
    updateProgress();
  }
  
  function updateProgress() {
    const answered = jawaban.filter(j => j !== null).length;
    const progress = document.getElementById('progressText');
    if (progress) progress.innerHTML = `📝 Terjawab: ${answered} / ${soalData.length} soal`;
  }
  
  function startTimer() {
    timerInterval = setInterval(() => {
      if (!ujianSelesai && waktu > 0) {
        waktu--;
        const menit = Math.floor(waktu / 60);
        const detik = waktu % 60;
        const timerDisplay = document.getElementById('timerDisplay');
        if (timerDisplay) timerDisplay.innerText = `${menit.toString().padStart(2, '0')}:${detik.toString().padStart(2, '0')}`;
        if (waktu === 0) {
          alert("WAKTU HABIS! Ujian akan disubmit otomatis.");
          submitExamFromTimer();
        }
      }
    }, 1000);
  }
  
  function submitExamFromTimer() {
    if (ujianSelesai) return;
    const nama = document.querySelector('.info-siswa') ? ... : 'Siswa';
    submitExam('Siswa', 'Kelas');
  }
  
  function submitExam(nama, kelas) {
    const belumDijawab = jawaban.filter(j => j === null).length;
    if (belumDijawab > 0) {
      alert(`Masih ada ${belumDijawab} soal yang belum dijawab!`);
      return;
    }
    
    ujianSelesai = true;
    clearInterval(timerInterval);
    
    // Hitung skor berdasarkan kunci jawaban dari soalData
    let score = 0;
    jawaban.forEach((jawab, idx) => {
      if (jawab === soalData[idx].kunci) score++;
    });
    const nilai = Math.round((score / soalData.length) * 100);
    
    document.getElementById('soalContainer').innerHTML = `
      <div class="result-card">
        <h2>🎉 UJIAN SELESAI 🎉</h2>
        <div class="nilai-besar">${nilai}%</div>
        <p>Skor: ${score} / ${soalData.length}</p>
        <p>${nilai >= 75 ? '✅ LULUS' : '❌ TIDAK LULUS'}</p>
      </div>
    `;
    const navButtons = document.querySelector('.nav-buttons');
    if (navButtons) navButtons.style.display = 'none';
    const submitBtn = document.getElementById('submitUjianBtn');
    if (submitBtn) submitBtn.style.display = 'none';
    const timerBox = document.querySelector('.timer-box');
    if (timerBox) timerBox.style.display = 'none';
    
    // Kirim ke Telegram
    kirimTelegram(nama, kelas, score, nilai);
  }
  
  // ========== DASHBOARD GURU ==========
  function startTeacherDashboard(nama) {
    document.getElementById('loginPage').style.display = 'none';
    const mainApp = document.getElementById('mainApp');
    
    mainApp.innerHTML = `
      <div class="container">
        <div class="dashboard-header">
          <h1>👨‍🏫 DASHBOARD GURU</h1>
          <div>
            <button id="tambahSoalBtnGuru" class="btn-tambah">+ Tambah Soal</button>
            <button id="logoutBtnGuru" class="btn-logout">Logout</button>
          </div>
        </div>
        <div style="background: #1a1f2e; border-radius: 16px; padding: 15px; margin-bottom: 20px;">
          <p>👤 Guru: <strong>${nama}</strong></p>
          <p>📋 Total Soal: <strong id="totalSoalCount">${soalData.length}</strong> soal</p>
          <p style="margin-top: 5px; font-size: 12px; color: #ffaa44;">💡 Tips: Kunci jawaban bisa diubah saat edit soal</p>
        </div>
        <div id="soalListContainer" class="soal-list"></div>
        <div class="credit-footer" style="margin-top: 30px;">© Dibuat oleh Rashad | SMK Dev</div>
      </div>
    `;
    
    mainApp.style.display = 'block';
    renderSoalList();
    
    document.getElementById('tambahSoalBtnGuru').onclick = tambahSoal;
    document.getElementById('logoutBtnGuru').onclick = () => location.reload();
  }
  
  function renderSoalList() {
    const container = document.getElementById('soalListContainer');
    if (!container) return;
    
    const optionLetters = ['A', 'B', 'C', 'D'];
    
    container.innerHTML = soalData.map((soal, idx) => `
      <div class="soal-item">
        <div class="soal-item-header">
          <span style="background: #ffaa44; color: #1a1a1a; padding: 2px 10px; border-radius: 20px;">Soal ${idx + 1}</span>
          <div>
            <button onclick="editSoalFunc(${idx})" style="background: #44aaff; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer;">✏️ Edit</button>
            <button onclick="hapusSoalFunc(${idx})" style="background: #dc2626; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer; margin-left: 5px;">🗑️ Hapus</button>
          </div>
        </div>
        <div class="soal-text" style="margin-top: 10px;">📖 ${soal.text}</div>
        <div style="font-size: 12px; color: #888; margin-top: 10px;">
          A. ${soal.options[0]}<br>
          B. ${soal.options[1]}<br>
          C. ${soal.options[2]}<br>
          D. ${soal.options[3]}
        </div>
        <div class="kunci-badge">
          🔑 Kunci Jawaban: ${optionLetters[soal.kunci]} (${soal.options[soal.kunci]})
        </div>
      </div>
    `).join('');
    
    const totalSpan = document.getElementById('totalSoalCount');
    if (totalSpan) totalSpan.innerText = soalData.length;
  }
  
  window.editSoalFunc = function(idx) {
    const soal = soalData[idx];
    const optionLetters = ['A', 'B', 'C', 'D'];
    
    const newText = prompt("Edit soal:", soal.text);
    if (newText) soal.text = newText;
    
    const newA = prompt("Option A:", soal.options[0]);
    const newB = pro
