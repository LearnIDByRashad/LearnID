<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔒 UJIAN ONLINE SMK | LearnID / TeachID</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0f1a 0%, #0a0a0f 100%);
      color: #e0e0e0;
      min-height: 100vh;
    }
    
    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .login-card {
      background: #11151f;
      border-radius: 32px;
      padding: 40px 30px;
      text-align: center;
      border: 1px solid #2a3040;
      max-width: 400px;
      width: 100%;
    }
    
    .login-card h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff, #a0a0a0);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    
    .role-buttons {
      display: flex;
      gap: 20px;
      margin: 30px 0;
    }
    
    .role-btn {
      flex: 1;
      background: #1a1f2e;
      border: 2px solid #2a3040;
      border-radius: 60px;
      padding: 15px;
      cursor: pointer;
      text-align: center;
    }
    
    .role-btn i {
      font-size: 2rem;
      display: block;
      margin-bottom: 8px;
    }
    
    .learnid i { color: #44aaff; }
    .teachid i { color: #ffaa44; }
    
    .login-input {
      margin-top: 20px;
    }
    
    .login-input input {
      width: 100%;
      padding: 14px;
      border-radius: 60px;
      border: 1px solid #2a3040;
      background: #1a1f2e;
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
    }
    
    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 60px;
      background: #ffaa44;
      color: #1a1a1a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .lockdown-bar {
      background: #dc2626;
      color: white;
      text-align: center;
      padding: 8px;
      font-size: 12px;
    }
    
    .timer-box {
      background: #1a1f2e;
      border: 2px solid #ff4444;
      border-radius: 60px;
      padding: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .timer {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ff4444;
    }
    
    .soal-card {
      background: #11151f;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2a3040;
    }
    
    .soal-text {
      font-size: 1rem;
      margin-bottom: 20px;
    }
    
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .option {
      background: #1a1f2e;
      border: 1px solid #2a3040;
      border-radius: 50px;
      padding: 12px 18px;
      cursor: pointer;
      display: flex;
      gap: 12px;
    }
    
    .option.selected {
      background: #2a3045;
      border-color: #ffaa44;
    }
    
    .nav-buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    
    button {
      background: #2a3040;
      border: none;
      padding: 12px;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      flex: 1;
    }
    
    .primary { background: #ffaa44; color: #1a1a1a; }
    .danger { background: #dc2626; }
    
    .progress {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
    
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .btn-tambah, .btn-logout {
      padding: 10px 20px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
    }
    
    .btn-tambah { background: #ffaa44; color: #1a1a1a; }
    .btn-logout { background: #dc2626; color: white; }
    
    .soal-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .soal-item {
      background: #1a1f2e;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #2a3040;
    }
    
    .soal-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    
    .credit {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #666;
      padding: 10px;
    }
    
    @media (max-width: 600px) {
      .role-buttons { flex-direction: column; }
      .timer { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="loginPage">
    <div class="login-page">
      <div class="login-card">
        <h1>📚 UJIAN ONLINE SMK</h1>
        <div class="role-buttons">
          <div class="role-btn learnid" onclick="pilihRole('learn')">
            <i>🎓</i>
            <div>LearnID</div>
            <small>Siswa</small>
          </div>
          <div class="role-btn teachid" onclick="pilihRole('teach')">
            <i>👨‍🏫</i>
            <div>TeachID</div>
            <small>Guru</small>
          </div>
        </div>
        <div id="loginInputArea" style="display: none;">
          <input type="text" id="namaUser" placeholder="Masukkan Nama Lengkap">
          <input type="text" id="kelasUser" placeholder="Kelas">
          <button class="login-btn" onclick="prosesLogin()">Login</button>
        </div>
      </div>
    </div>
  </div>
  
  <div id="mainArea" style="display: none;"></div>
</div>

<script>
  // DATA SOAL
  let soalData = [
    { text: "Apa kepanjangan dari SMK?", options: ["Sekolah Menengah Kejuruan", "Sekolah Menengah Karir", "Sekolah Menengah Kreatif", "Sekolah Menengah Kompeten"] },
    { text: "Berapa nilai minimal KKM umumnya?", options: ["60", "65", "70", "75"] },
    { text: "Apa itu Ujian Sekolah?", options: ["Ujian sekolah", "Ujian nasional", "Ujian masuk PTN", "Ujian praktek"] },
    { text: "Siapa yang bertanggung jawab atas ujian sekolah?", options: ["Kepala Sekolah", "Guru", "Dinas Pendidikan", "Semua benar"] },
    { text: "Apa tujuan utama ujian sekolah?", options: ["Mengukur kompetensi", "Membuat stres", "Mengisi waktu", "Menaikkan gaji"] }
  ];
  
  let kunciJawaban = [0, 0, 0, 0, 0];
  let roleTerpilih = null;
  
  function pilihRole(role) {
    roleTerpilih = role;
    document.getElementById('loginInputArea').style.display = 'block';
    const kelasInput = document.getElementById('kelasUser');
    if (role === 'learn') {
      kelasInput.style.display = 'block';
      kelasInput.placeholder = "Kelas (contoh: XII RPL 1)";
    } else {
      kelasInput.style.display = 'none';
    }
  }
  
  function prosesLogin() {
    const nama = document.getElementById('namaUser').value.trim();
    const kelas = document.getElementById('kelasUser').value.trim();
    
    if (!nama) {
      alert("Masukkan nama lengkap!");
      return;
    }
    
    if (!roleTerpilih) {
      alert("Pilih role terlebih dahulu!");
      return;
    }
    
    if (roleTerpilih === 'learn' && !kelas) {
      alert("Masukkan kelas!");
      return;
    }
    
    if (roleTerpilih === 'learn') {
      mulaiUjian(nama, kelas);
    } else {
      mulaiDashboard(nama);
    }
  }
  
  // ========== UJIAN SISWA ==========
  let jawabanSiswa = [];
  let soalSekarang = 0;
  let waktuTersisa = 90 * 60;
  let timerJalan = null;
  let ujianSelesai = false;
  
  function mulaiUjian(nama, kelas) {
    jawabanSiswa = new Array(soalData.length).fill(null);
    soalSekarang = 0;
    waktuTersisa = 90 * 60;
    ujianSelesai = false;
    if (timerJalan) clearInterval(timerJalan);
    
    document.getElementById('loginPage').style.display = 'none';
    const mainArea = document.getElementById('mainArea');
    
    mainArea.innerHTML = `
      <div class="lockdown-bar">🔒 LOCKDOWN MODE 🔒 | DILARANG KELUAR</div>
      <div class="container">
        <div style="background: #1a1f2e; border-radius: 16px; padding: 12px; margin-bottom: 20px;">
          <p>👤 Nama: <strong>${nama}</strong></p>
          <p>📚 Kelas: <strong>${kelas}</strong></p>
        </div>
        <div class="timer-box">
          <div class="timer" id="timerDisplay">90:00</div>
          <div>Sisa Waktu</div>
        </div>
        <div id="soalContainer"></div>
        <div class="nav-buttons">
          <button id="prevBtn">◀ Sebelumnya</button>
          <button id="nextBtn" class="primary">Selanjutnya ▶</button>
        </div>
        <div class="progress" id="progressText"></div>
        <button id="submitBtn" class="danger" style="margin-top: 20px;">📤 SUBMIT UJIAN</button>
        <div class="credit">© 2026 | Made by Rashad</div>
      </div>
    `;
    
    mainArea.style.display = 'block';
    renderSoalUjian();
    mulaiTimer();
    
    document.getElementById('prevBtn').onclick = () => { if (soalSekarang > 0) { soalSekarang--; renderSoalUjian(); } };
    document.getElementById('nextBtn').onclick = () => { if (soalSekarang < soalData.length - 1) { soalSekarang++; renderSoalUjian(); } };
    document.getElementById('submitBtn').onclick = () => submitUjian(nama, kelas);
  }
  
  function renderSoalUjian() {
    const container = document.getElementById('soalContainer');
    const soal = soalData[soalSekarang];
    const jawab = jawabanSiswa[soalSekarang];
    
    container.innerHTML = `
      <div class="soal-card">
        <div style="background: #ffaa44; color: #1a1a1a; display: inline-block; padding: 4px 12px; border-radius: 30px; font-size: 12px; margin-bottom: 15px;">
          Soal ${soalSekarang + 1}
        </div>
        <div class="soal-text">${soal.text}</div>
        <div class="options">
          ${soal.options.map((opt, idx) => `
            <div class="option ${jawab === idx ? 'selected' : ''}" data-opt="${idx}">
              <span class="option-letter">${String.fromCharCode(65 + idx)}.</span>
              <span>${opt}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    
    document.querySelectorAll('.option').forEach(opt => {
      opt.onclick = () => {
        jawabanSiswa[soalSekarang] = parseInt(opt.dataset.opt);
        renderSoalUjian();
        updateProgressUjian();
      };
    });
    updateProgressUjian();
  }
  
  function updateProgressUjian() {
    const answered = jawabanSiswa.filter(j => j !== null).length;
    const progress = document.getElementById('progressText');
    if (progress) progress.innerHTML = `📝 Terjawab: ${answered} / ${soalData.length} soal`;
  }
  
  function mulaiTimer() {
    timerJalan = setInterval(() => {
      if (!ujianSelesai && waktuTersisa > 0) {
        waktuTersisa--;
        const menit = Math.floor(waktuTersisa / 60);
        const detik = waktuTersisa % 60;
        const timerDisplay = document.getElementById('timerDisplay');
        if (timerDisplay) timerDisplay.innerText = `${menit.toString().padStart(2, '0')}:${detik.toString().padStart(2, '0')}`;
        if (waktuTersisa === 0) submitUjian();
      }
    }, 1000);
  }
  
  function submitUjian(nama, kelas) {
    const belumDijawab = jawabanSiswa.filter(j => j === null).length;
    if (belumDijawab > 0) {
      alert(`⚠️ Masih ada ${belumDijawab} soal yang belum dijawab!`);
      return;
    }
    
    ujianSelesai = true;
    clearInterval(timerJalan);
    
    let score = 0;
    for (let i = 0; i < jawabanSiswa.length; i++) {
      if (jawabanSiswa[i] === kunciJawaban[i]) score++;
    }
    const nilai = Math.round((score / soalData.length) * 100);
    
    document.getElementById('soalContainer').innerHTML = `
      <div class="result-card" style="background: #11151f; border-radius: 24px; padding: 30px; text-align: center;">
        <h2>🎉 UJIAN SELESAI 🎉</h2>
        <div style="font-size: 3rem; margin: 20px;">${nilai}%</div>
        <p>Skor: ${score} / ${soalData.length}</p>
        <p>${nilai >= 75 ? '✅ LULUS' : '❌ TIDAK LULUS'}</p>
      </div>
    `;
    document.querySelector('.nav-buttons').style.display = 'none';
    document.getElementById('submitBtn').style.display = 'none';
    document.querySelector('.timer-box').style.display = 'none';
    
    kirimKeTelegram(nama, kelas, score, nilai);
  }
  
  // ========== DASHBOARD GURU ==========
  function mulaiDashboard(nama) {
    document.getElementById('loginPage').style.display = 'none';
    const mainArea = document.getElementById('mainArea');
    
    mainArea.innerHTML = `
      <div class="container">
        <div class="dashboard-header">
          <h1>👨‍🏫 DASHBOARD GURU</h1>
          <div>
            <button class="btn-tambah" onclick="tambahSoal()">+ Tambah Soal</button>
            <button class="btn-logout" onclick="location.reload()">Logout</button>
          </div>
        </div>
        <div style="background: #1a1f2e; border-radius: 16px; padding: 15px; margin-bottom: 20px;">
          <p>👤 Guru: <strong>${nama}</strong></p>
          <p>📋 Total Soal: <strong id="totalSoal">${soalData.length}</strong> soal</p>
        </div>
        <div id="soalList"></div>
        <div class="credit">© 2026 | Made by Rashad</div>
      </div>
    `;
    
    mainArea.style.display = 'block';
    renderSoalList();
  }
  
  function renderSoalList() {
    const container = document.getElementById('soalList');
    if (!container) return;
    
    container.innerHTML = soalData.map((soal, idx) => {
      const kunciHuruf = String.fromCharCode(65 + kunciJawaban[idx]);
      return `
        <div class="soal-item">
          <div class="soal-item-header">
            <span style="background: #ffaa44; color: #1a1a1a; padding: 2px 10px; border-radius: 20px;">Soal ${idx + 1}</span>
            <div>
              <button onclick="editKunci(${idx})" style="background: #ffaa44; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer;">🔑 Kunci: ${kunciHuruf}</button>
              <button onclick="editSoal(${idx})" style="background: #44aaff; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer;">✏️ Edit</button>
              <button onclick="hapusSoal(${idx})" style="background: #dc2626; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer;">🗑️ Hapus</button>
            </div>
          </div>
          <div style="margin-top: 10px;">📖 ${soal.text}</div>
          <div style="font-size: 12px; color: #888; margin-top: 10px;">
            A. ${soal.options[0]}<br> B. ${soal.options[1]}<br> C. ${soal.options[2]}<br> D. ${soal.options[3]}
          </div>
        </div>
      `;
    }).join('');
    
    const totalSpan = document.getElementById('totalSoal');
    if (totalSpan) totalSpan.innerText = soalData.length;
  }
  
  window.editKunci = function(idx) {
    const val = prompt(`Kunci jawaban soal ${idx + 1}:\n0=A | 1=B | 2=C | 3=D`, kunciJawaban[idx]);
    if (val !== null) {
      const v = parseInt(val);
      if (v >= 0 && v <= 3) {
        kunciJawaban[idx] = v;
        alert(`✅ Kunci diubah menjadi ${String.fromCharCode(65 + v)}`);
        renderSoalList();
      } else alert("Masukkan 0-3");
    }
  };
  
  window.editSoal = function(idx) {
    const soal = soalData[idx];
    const newText = prompt("Edit soal:", soal.text);
    if (newText) soal.text = newText;
    const a = prompt("Option A:", soal.options[0]);
    const b = prompt("Option B:", soal.options[1]);
    const c = prompt("Option C:", soal.options[2]);
    const d = prompt("Option D:", soal.options[3]);
    if (a) soal.options[0] = a;
    if (b) soal.options[1] = b;
    if (c) soal.options[2] = c;
    if (d) soal.options[3] = d;
    renderSoalList();
    alert("✅ Soal diedit!");
  };
  
  window.hapusSoal = function(idx) {
    if (confirm("Hapus soal ini?")) {
      soalData.splice(idx, 1);
      kunciJawaban.splice(idx, 1);
      renderSoalList();
      alert("✅ Soal dihapus!");
    }
  };
  
  window.tambahSoal = function() {
    const text = prompt("Teks soal:");
    if (!text) return;
    const a = prompt("Option A:");
    const b = prompt("Option B:");
    const c = prompt("Option C:");
    const d = prompt("Option D:");
    if (a && b && c && d) {
      soalData.push({ text, options: [a, b, c, d] });
      kunciJawaban.push(0);
      renderSoalList();
      alert("✅ Soal ditambahkan!");
    } else alert("Isi semua option!");
  };
  
  // ========== TELEGRAM ==========
  function kirimKeTelegram(nama, kelas, score, nilai) {
    const pesan = `📢 HASIL UJIAN SMK\n\nNama: ${nama}\nKelas: ${kelas}\nSkor: ${score}/${soalData.length}\nNilai: ${nilai}%\nStatus: ${nilai >= 75 ? 'LULUS ✅' : 'TIDAK LULUS ❌'}`;
    fetch(`https://api.telegram.org/bot8743858038:AAHr-VAbGCphu9uy584HPG6GunbdFG3AjE8/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: '7509845641', text: pesan })
    }).catch(e => console.log(e));
  }
  
  // Blok klik kanan & F12
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();
  });
</script>
</body>
</html>
